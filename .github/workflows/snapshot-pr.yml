# Робот пересъёма: ветку snapshot/dev пишет рабочий процесс в Artogceo/ERP-AKEDA
# после каждой посадки в dev (ключом только на запись этой ветки). Здесь она
# превращается в pull request, на котором идут обычные проверки SDK.
# Слияние и номер версии остаются за человеком: свежий снимок — не выпуск.
name: Snapshot PR
on:
  push:
    branches: [snapshot/dev]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-or-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Открыть или обновить pull request пересъёма
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%b)"
          number="$(gh pr list --head snapshot/dev --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base main --head snapshot/dev --title "$title" --body "$body"
          else
            gh pr edit "$number" --title "$title" --body "$body"
            echo "PR #$number обновлён"
          fi
